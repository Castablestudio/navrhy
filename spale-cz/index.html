<section class="sec"><div class="wrap"><div class="sec-head"><h2>Operační výkony</h2><p class="lead">Operace za hospitalizace indikujeme, objednáváme a provádíme v Nemocnici Rudolfa a Stefanie v Benešově (www.hospital-bn.cz).</p></div><div class="lists"><div class="list-col"><h3>V ambulanci</h3><ul class="ticks"><li>Excize pih, znamének, bradavic a dalších kožních afekcí</li><li>Karpální tunely</li><li>Lupavé prsty</li><li>Operace hemoroidů HAL</li><li>Barronova ligatura hemoroidů</li></ul></div><div class="list-col"><h3>V nemocnici</h3><ul class="ticks"><li>Kýly, včetně laparoskopických</li><li>Operace žlučníků</li><li>Proktologická operativa (hemoroidy, trhliny, píštěle)</li></ul></div></div></div></section><section class="sec"><div class="wrap"><div class="sec-head"><h2>Další péče</h2></div><div class="lists"><div class="list-col"><h3>Úrazy a rány</h3><ul class="ticks"><li>Ošetření a léčení drobných úrazů</li><li>Ošetřování a převazy ran a defektů (operačních, úrazových, chronických, komplikovaných)</li><li>Péče o bolesti kloubů, svalů, šlach a jejich úponů</li><li>Proktologie (nemoci řitě a konečníku)</li></ul></div><div class="list-col"><h3>Po nemocnici a konzultace</h3><ul class="ticks"><li>Následná péče po propuštění z nemocnice</li><li>Konzultační činnost v oboru chirurgie</li><li>Administrativní činnost (pojistky apod.)</li><li>Další péče v rozsahu obvyklém jiným ambulantním chirurgickým pracovištím</li></ul></div></div></div></section><section class="cta-band"><div class="wrap"><div><h2>Máte dotaz?</h2><p>Napište nám na WhatsApp, SMS nebo e-mail.</p></div><div class="cta-btns"><a class="btn btn-inv" href="https://wa.me/420735835255" target="_blank" rel="noopener"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg><span>Napsat na WhatsApp</span></a><a class="btn b <script>(()=>{
const root=document.getElementById('nahled-root'),toast=document.getElementById('nahled-toast');let t;
const say=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('on'),3200)};
const burger=()=>{const b=root.querySelector('.burger'),n=root.querySelector('#menu');if(!b||!n)return;
 const set=o=>{b.setAttribute('aria-expanded',o);document.body.classList.toggle('menu-open',o);b.querySelector('.burger-t').textContent=o?'Zavřít':'Menu'};
 b.addEventListener('click',()=>set(b.getAttribute('aria-expanded')!=='true'));set(false)};
const show=(slug,hash)=>{const tp=document.getElementById('p-'+slug);if(!tp)return;
 root.innerHTML='';root.appendChild(tp.content.cloneNode(true));
 document.body.className=tp.dataset.cls;document.title=tp.dataset.title;burger();
 const el=hash&&root.querySelector(hash);(el?el.scrollIntoView():window.scrollTo(0,0))};
const desc=h=>{const d=decodeURIComponent(h);
 if(d.startsWith('https://wa.me/'))return'WhatsApp: otevře chat s číslem +'+d.slice(14);
 if(d.startsWith('sms:'))return'SMS: otevře zprávu na číslo '+d.slice(4);
 if(d.startsWith('tel:'))return'Telefon: vytočí '+d.slice(4);
 if(d.startsWith('mailto:'))return'E-mail: otevře nový e-mail na '+d.slice(7);return null};
document.addEventListener('click',ev=>{const a=ev.target.closest('a');if(!a)return;const h=a.getAttribute('href')||'';
 const m=desc(h);if(m){ev.preventDefault();say(m+' (v náhledu vypnuto)');return}
 const p=h.match(/^([a-z0-9-]+)\.html(#.*)?$/i);if(p){ev.preventDefault();show(p[1],p[2]);document.body.classList.remove('menu-open');return}
 if(h.startsWith('#')){const el=root.querySelector(h);if(el){ev.preventDefault();el.scrollIntoView()}}
});
document.addEventListener('keydown',ev=>{const b=root.querySelector('.burger');if(ev.key==='Escape'&&b&&b.getAttribute('aria-expanded')==='true')b.click()});
show('index');
})();</script>
