<style>/* Hallmark · shape: návrh firmy (celynavrh v2) · genre: editorial · theme: Piste (sablona garaz) · job: hire

/* Hallmark · pre-emit critique: P4 H4 E4 S3 R4 V4 · weakest: S, šablona pro všechny firmy; konkrétnost nesou texty a fotky z obsah.json */
/* Hallmark · answered F7 · plovoucí lišta je pilulka podle tématu, jinak pilulky jen na ovládacích prvcích */
/* Hallmark · waive 77 · Lékařskou prohlídku vám zprostředkujeme má jedinou zprávu · Autoškola Bartoníček: Nemáte svého lékaře nebo spěcháte? stojí jako věta velkým písmem vedle nadpisu */
:root {
  color-scheme: light;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
  --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.25rem; --text-xl: 1.5625rem; --text-2xl: 1.953rem; --text-3xl: 2.441rem;
  --text-display-s: clamp(2.25rem, 4vw + 0.5rem, 3.75rem); --text-display: clamp(2.75rem, 5vw + 1rem, 5.25rem);
  --text-section: clamp(2rem, 2.5vw + 1rem, 3.5rem); --text-title: clamp(1.25rem, 0.75vw + 0.875rem, 1.625rem); --text-lead: clamp(1.125rem, 0.35vw + 1rem, 1.375rem);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --color-error: oklch(52% 0.19 27); --color-success: oklch(50% 0.12 150);
  --container: 1440px; --gutter: 64px; --gap-columns: 32px; --section-gap-s: 120px; --section-gap: 144px; --section-gap-l: 176px;
  --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400; --z-toast: 500; --z-tooltip: 600;
  --color-paper: oklch(98.5% 0.005 260); --color-paper-2: oklch(95.5% 0.008 260); --color-paper-3: oklch(91% 0.01 260);
  --color-ink: oklch(16% 0.012 260); --color-ink-2: oklch(30% 0.014 260); --color-muted: oklch(48% 0.016 260);
  --color-rule: oklch(88% 0.01 260);
  --color-accent: oklch(52% 0.25 265); --color-accent-deep: oklch(40% 0.2 266); --color-accent-ink: oklch(98.5% 0.004 260); --color-focus: oklch(58% 0.22 28);
  --color-field: var(--color-accent);
  --font-display: "Barlow Condensed", ui-sans-serif, sans-serif; --font-body: "Barlow", ui-sans-serif, sans-serif; --font-outlier: var(--font-display);
  --radius-card: 0; --radius-pill: 0; --rule-hair: 1px; --rule-bar: 2px;
  --shadow-card: none;
  --tracking-display: -0.005em; --display-weight: 800;
}

:root { --color-accent: oklch(43.9% 0.141 259.9); --color-accent-ink: oklch(98.5% 0.005 260.0); --color-accent-deep: oklch(43.9% 0.141 259.9); --color-focus: oklch(43.9% 0.141 259.9); --color-accent-2: color-mix(in oklab, oklch(43.9% 0.141 259.9) 84%, oklch(98.5% 0.005 260.0)); }
:root { --deep: oklch(26.0% 0.070 259.9); --deep-2: oklch(31.0% 0.070 259.9); --on-deep: oklch(96.0% 0.012 259.9); --on-deep-2: oklch(82.0% 0.030 259.9); --deep-rule: color-mix(in oklab, oklch(96.0% 0.012 259.9) 22%, oklch(26.0% 0.070 259.9)); --hero-btn: oklch(96.0% 0.012 259.9); --hero-btn-ink: oklch(26.0% 0.070 259.9); }
*, *::before, *::after { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight, 700); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.05; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1 { max-width: 20ch; font-size: var(--text-display); } h2 { max-width: 30ch; font-size: var(--text-section); } h3 { max-width: 40ch; font-size: var(--text-title); line-height: 1.2; }

[hidden] { display: none !important; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); box-sizing: border-box; }
.num, .figure, td.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[data-slot] { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--color-paper-2, var(--color-paper)), var(--color-paper-3, var(--color-paper))); }
[data-slot] > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
[data-slot]:has(> img) > :not(img):not([data-keep]) { display: none !important; }
@media (max-width: 60rem) { :root { --gutter: 24px; --section-gap-s: 80px; --section-gap: 96px; --section-gap-l: 120px; } }
@media (max-width: 40rem) { :root { --gutter: 16px; --section-gap-s: 56px; --section-gap: 72px; --section-gap-l: 96px; --gap-columns: 16px; } }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }

/* celynavrh v2: stránka nad tokeny a základem Hallmarku (tokens.css + base.css z theme.mjs scaffold).
   Žádná barva ani písmo mimo tokeny; najetí myší jen na zařízeních s myší; stisk 0.97; klikací plochy 44 px. */
body { font-size: 1.0625rem; line-height: 1.6; color: var(--color-ink); }
h1, h2, h3 { color: var(--color-ink); }
h2 { font-size: var(--text-section); }
.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.lead { font-size: var(--text-lead); line-height: 1.45; color: var(--color-ink-2); max-width: 48ch; }
.skip { position: absolute; left: var(--space-md); top: calc(-1 * var(--space-3xl)); z-index: var(--z-toast); padding: var(--space-xs) var(--space-md); background: var(--color-ink); color: var(--color-paper); }
.skip:focus-visible { top: var(--space-md); }
a { color: inherit; text-decoration-color: var(--color-accent); text-underline-offset: 0.2em; }
svg { flex: none; }
li, dd, td, .lead { text-wrap: pretty; }

/* tlačítka: plné jen jedno na obrazovce, ostatní obrysová */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 48px; padding: 0 var(--space-lg); border: 1.5px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font: 500 var(--text-md)/1 var(--font-body); white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn--sm { min-height: 44px; padding: 0 var(--space-md); font-size: var(--text-sm); }
.btn--inv { background: var(--on-deep); border-color: var(--on-deep); color: var(--deep); }
.btn--line-inv { border-color: var(--on-deep-2); color: var(--on-deep); }
.link { display: inline-flex; align-items: center; min-height: 48px; color: var(--color-ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 0.25em; }

/* hlavička: plovoucí pilulka */
.top.top--plovouci { position: sticky; top: var(--space-sm); }
/* menu nahoře stojí na místě a při posouvání neplave (Pepa 24. 11. 2026); plovoucí jen s "lista": "plovouci" v obsah.json */
.top { position: relative; top: auto; z-index: var(--z-sticky-nav); padding-inline: var(--gutter); margin-top: var(--space-sm); }
.top + main > :first-child { margin-top: calc(-1 * var(--space-2xl) - 2 * var(--space-sm)); padding-top: calc(2 * var(--space-2xl) + 2 * var(--space-sm)); }
.top-in { position: relative; display: flex; align-items: center; gap: var(--space-lg); max-width: calc(var(--container) - 2 * var(--gutter)); min-height: var(--space-2xl); margin-inline: auto; padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-lg); background: var(--color-paper); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); }
.brand { display: flex; align-items: center; min-height: 44px; margin-right: auto; color: var(--color-ink); text-decoration: none; font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-lg); letter-spacing: var(--tracking-display); line-height: 1.1; }
.logo { max-height: 40px; width: auto; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: var(--space-2xs); }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-sm); color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 500; text-decoration: none; white-space: nowrap; border-radius: var(--radius-pill); }
.nav a[aria-current="page"] { color: var(--color-ink); text-decoration: underline; text-decoration-color: var(--color-accent); text-decoration-thickness: 2px; text-underline-offset: 0.45em; }
.burger { display: none; align-items: center; gap: var(--space-xs); min-height: 44px; padding: 0 var(--space-md); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink); font: 500 var(--text-sm) var(--font-body); cursor: pointer; }
.burger:focus-visible, .nav a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.burger-i { position: relative; width: 18px; height: 2px; background: currentColor; transition: background-color var(--dur-short) var(--ease-out); }
.burger-i::before, .burger-i::after { content: ""; position: absolute; left: 0; width: 18px; height: 2px; background: currentColor; transition: transform var(--dur-short) var(--ease-out); }
.burger-i::before { top: -6px; } .burger-i::after { top: 6px; }
.menu-open .burger-i { background: transparent; }
.menu-open .burger-i::before { transform: translateY(6px) rotate(45deg); }
.menu-open .burger-i::after { transform: translateY(-6px) rotate(-45deg); }

/* první obrazovka */
.hero { display: grid; align-items: end; min-height: calc(100svh - var(--space-2xl)); padding-bottom: var(--space-2xl); background: var(--deep); color: var(--on-deep); }
.hero h1, .phead h1 { color: var(--on-deep); }
.hero .lead, .phead .lead { color: var(--on-deep-2); }
.hero .link { color: var(--on-deep); }
.hero-txt .btn--primary { background: var(--hero-btn); border-color: var(--hero-btn); color: var(--hero-btn-ink); }
.hero-txt .btn:not(.btn--primary) { border-color: var(--on-deep-2); color: var(--on-deep); }
.hero-txt .btn:focus-visible, .hero-txt .link:focus-visible, .phead a:focus-visible { outline-color: var(--on-deep); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--space-3xl); align-items: end; }
.hero-grid--book { align-items: start; }
.hero-grid--book .hero-txt { padding-top: var(--space-xl); }
.hero-grid--solo { grid-template-columns: minmax(0, 1fr); min-height: 0; padding-block: var(--space-2xl); }
.hero h1 { font-size: var(--text-display); max-width: 14ch; }
.hero .lead { margin-top: var(--space-lg); }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm) var(--space-lg); margin-top: var(--space-xl); }
.hero-pic { margin: 0; aspect-ratio: 4 / 5; max-height: 72svh; overflow: hidden; border-radius: var(--radius-card); }
.hero-pic img, .pic img, .bleed img { width: 100%; height: 100%; object-fit: cover; }
.card { background: var(--color-paper); color: var(--color-ink); padding: var(--space-2xl) var(--space-xl) var(--space-xl); border-radius: var(--radius-card); }
.card .rows > div { grid-template-columns: minmax(0, 1fr); gap: var(--space-2xs); padding-block: var(--space-md); }
.card .rows dd { font-size: var(--text-2xl); }
.card h2 { max-width: none; font-size: var(--text-2xl); margin-bottom: var(--space-sm); padding-bottom: var(--space-md); border-bottom: 2px solid var(--color-ink); }
.rows { margin: 0; }
.rows > div { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--space-md); padding-block: var(--space-md); border-bottom: 1px solid var(--color-rule); align-items: baseline; }
.rows > div:last-child { border-bottom: 0; }
.rows dt { font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.rows dd { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-xl); line-height: 1.25; letter-spacing: var(--tracking-display); color: var(--color-ink); overflow-wrap: anywhere; font-variant-numeric: lining-nums tabular-nums; }
.rows dd a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: underline; text-decoration-color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
.phead { padding-bottom: var(--space-xl); background: var(--deep); color: var(--on-deep); }
.phead h1 { font-size: var(--text-display-s); max-width: 18ch; }
.phead .lead { margin-top: var(--space-md); }
.crumb { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-md); font-size: var(--text-sm); color: var(--on-deep-2); }
.crumb a { color: inherit; }

/* objednání v první obrazovce (obory s objednáváním) */
.book { display: grid; gap: var(--space-md); }
.book h2 { margin-bottom: 0; }
.seg { margin: 0; padding: 0; border: 0; min-width: 0; }
.seg legend { padding: 0; margin-bottom: var(--space-xs); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.seg-o { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-md); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink); font-size: var(--text-md); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; user-select: none; transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
.seg input:checked + label { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }
.seg input:focus-visible + label { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.seg label:active { transform: scale(0.97); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-sm); }
.field { display: grid; gap: var(--space-2xs); }
.field label { font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.field input { min-height: 48px; padding: 0 var(--space-md); border: 1px solid var(--color-muted); border-radius: var(--radius-card); background: var(--color-paper); color: var(--color-ink); font: inherit; outline: 2px solid transparent; }
.field input:focus-visible { outline-color: var(--color-focus); }
.field input[aria-invalid] { border-color: var(--color-error); }
.book-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm) var(--space-lg); padding-top: var(--space-md); border-top: 1px solid var(--color-rule); }
.help { flex: 1 1 16rem; font-size: var(--text-sm); color: var(--color-ink-2); }

/* sekce */
.sec { padding-block: var(--section-gap-s); }
.sec + .sec { border-top: 1px solid var(--color-rule); }
.sec--alt { background: var(--color-paper-2); border-top: 0 !important; }
.sec--alt + .sec { border-top: 0; }
.sec-head { margin-bottom: var(--space-2xl); }
.sec-head .lead { margin-top: var(--space-md); }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-3xl); align-items: start; }
.split .sec-head { margin-bottom: 0; }
.split--pic { align-items: center; }
.split--pic .sec-head { margin-bottom: var(--space-lg); }
.sticky { position: sticky; top: calc(var(--space-3xl) + var(--space-lg)); }
.prose { display: grid; gap: var(--space-md); }
.prose p:not(.lead) { color: var(--color-ink-2); max-width: 62ch; }
.prose .lead { color: var(--color-ink); max-width: 40ch; }
.pic { margin: 0; aspect-ratio: 4 / 5; overflow: hidden; border-radius: var(--radius-card); }
.pic--sm { aspect-ratio: 4 / 3; }
.pic img, .hero-pic img, .bleed img { outline: 1px solid color-mix(in oklab, var(--color-ink) 8%, transparent); outline-offset: -1px; }

/* služby: řádky rejstříku místo karet */
.idx { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--color-ink); }
.idx li { display: grid; grid-template-columns: minmax(0, 9fr) minmax(0, 3fr); gap: var(--space-xl); align-items: end; padding-block: var(--space-lg); border-bottom: 1px solid var(--color-rule); }
.idx li > div { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-2xs) var(--space-xl); align-items: baseline; }
.idx :is(h2, h3) { font-size: var(--text-2xl); max-width: none; }
.idx p { color: var(--color-ink-2); }
.more { justify-self: end; display: inline-flex; align-items: center; min-height: 44px; color: var(--color-ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--color-accent); text-underline-offset: 0.25em; }

/* fakta */
.facts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xl) var(--gap-columns); }
.facts.n2, .facts.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.facts li { padding-top: var(--space-md); border-top: 2px solid var(--color-ink); }
.facts :is(h2, h3) { font-size: var(--text-xl); margin-bottom: var(--space-xs); max-width: none; }
.facts p { color: var(--color-ink-2); }
.note { border-top: 2px solid var(--color-ink); padding-top: var(--space-lg); display: grid; gap: var(--space-sm); align-content: start; }
.note-h { font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-section); line-height: 1.08; letter-spacing: var(--tracking-display); color: var(--color-ink); max-width: 22ch; text-wrap: balance; }
.note p:not(.note-h) { color: var(--color-ink-2); }

/* seznamy, lidé */
.lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-xl) var(--space-3xl); }
.lists.n1 { grid-template-columns: minmax(0, 1fr); max-width: 52rem; }
.list h3 { font-size: var(--text-2xl); margin-bottom: var(--space-md); }
.list h2 { font-size: var(--text-section); margin-bottom: var(--space-lg); }
.list ul { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--color-ink); }
.list li { padding-block: var(--space-sm); border-bottom: 1px solid var(--color-rule); color: var(--color-ink); }
.people { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--color-ink); }
.people li { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 4fr) minmax(0, 5fr); gap: var(--space-xl); align-items: center; padding-block: var(--space-md); border-bottom: 1px solid var(--color-rule); }
.prole { font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.pname { font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-xl); letter-spacing: var(--tracking-display); color: var(--color-ink); }
.pnote { font-size: var(--text-sm); color: var(--color-ink-2); }
.plinks { display: flex; flex-wrap: wrap; gap: 0 var(--space-lg); }
.plinks a { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 44px; color: var(--color-ink); font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
.plinks a svg { color: var(--color-muted); }

/* adresa */
.addr { display: grid; margin-block: var(--space-lg) var(--space-xl); font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-2xl); line-height: 1.25; letter-spacing: var(--tracking-display); color: var(--color-ink); }
.sec--alt .rows dd { font-size: var(--text-lg); }
.rows dd.long { font-family: var(--font-body); font-weight: 500; letter-spacing: 0; font-size: var(--text-md); line-height: 1.5; }

/* tabulka: linkovaný záznam */
.tbl { overflow-x: auto; }
.tbl table { width: 100%; min-width: 34rem; border-collapse: collapse; border-top: 2px solid var(--color-ink); font-variant-numeric: lining-nums tabular-nums; }
.tbl th, .tbl td { padding: var(--space-md) var(--space-md) var(--space-md) 0; border-bottom: 1px solid var(--color-rule); text-align: left; vertical-align: baseline; }
.tbl thead th { padding-block: var(--space-sm); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.tbl tbody th { font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-lg); letter-spacing: var(--tracking-display); color: var(--color-ink); }
.tbl td { color: var(--color-ink-2); }

/* dokumenty */
.docs { border-top: 2px solid var(--color-ink); }
.doc { border-bottom: 1px solid var(--color-rule); }
.doc summary { display: flex; align-items: center; gap: var(--space-md); min-height: 64px; cursor: pointer; list-style: none; font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-lg); letter-spacing: var(--tracking-display); }
.doc summary::-webkit-details-marker { display: none; }
.doc summary::after { content: "+"; margin-left: var(--space-sm); font-family: var(--font-body); font-size: var(--text-xl); color: var(--color-muted); transition: transform var(--dur-short) var(--ease-out); }
.doc[open] summary::after { transform: rotate(45deg); }
.doc summary small { margin-left: auto; font-family: var(--font-body); font-size: var(--text-sm); font-weight: 400; color: var(--color-muted); }
.doc summary:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.doc-body { padding-bottom: var(--space-lg); color: var(--color-ink-2); display: grid; gap: var(--space-sm); max-width: 68ch; }

/* kroky */
.steps { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--color-ink); }
.steps li { padding-block: var(--space-lg); border-bottom: 1px solid var(--color-rule); }
.steps li.has-pic { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: var(--space-xl); align-items: center; }
.steps :is(h2, h3) { font-size: var(--text-2xl); margin-bottom: var(--space-xs); }
.steps p { color: var(--color-ink-2); }

/* široká fotka a výzva */
.bleed { margin: 0; height: clamp(320px, 42vw, 640px); overflow: hidden; }
.flat { margin: 0; max-width: 100%; }
.flat img { width: 100%; height: 100%; object-fit: contain; }
.sec--flat { padding-block: var(--space-xl); }
.cta { background: var(--deep-2); color: var(--on-deep); padding-block: var(--section-gap-s); }
.cta h2 { color: var(--on-deep); font-size: var(--text-section); max-width: 22ch; }
.cta p { margin-top: var(--space-md); color: var(--on-deep-2); max-width: 52ch; }
.cta-in { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--space-xl); align-items: end; }
.cta-btns { display: flex; flex-wrap: wrap; gap: var(--space-sm); justify-content: flex-end; }
.cta .btn:focus-visible { outline-color: var(--on-deep); }

/* patička */
.foot { background: var(--deep); color: var(--on-deep); padding-block: var(--section-gap-s) var(--space-xl); }
.foot a:focus-visible { outline: 2px solid var(--on-deep); outline-offset: 2px; }
.foot-name { font-family: var(--font-display); font-weight: var(--display-weight, 600); font-size: var(--text-display-s); line-height: 1.04; letter-spacing: var(--tracking-display); color: var(--on-deep); max-width: 20ch; text-wrap: balance; }
.foot-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 3fr) minmax(0, 4fr); gap: var(--space-xl); margin-top: var(--space-2xl); padding-top: var(--space-lg); border-top: 1px solid var(--deep-rule); }
.foot-addr { display: grid; color: var(--on-deep); }
.foot-ct { display: grid; margin-top: var(--space-xs); }
.foot-addr span { line-height: 1.5; }
.foot a { display: inline-flex; align-items: center; min-height: 40px; color: var(--on-deep); text-decoration-color: var(--on-deep-2); }
.foot-nav { list-style: none; margin: 0; padding: 0; }
.foot-reg p { color: var(--on-deep-2); font-size: var(--text-sm); margin-bottom: var(--space-2xs); }
.foot-fine { margin-top: var(--space-lg); font-size: var(--text-sm); color: var(--on-deep-2); }

/* spodní lišta na telefonu */
.mbar { display: none; }

@media (max-width: 64rem) {
  .burger { display: inline-flex; }
  .top-act { display: none; }
  html:not(.js) .burger { display: none; }

  .mbar a { display: flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 48px; border-radius: var(--radius-pill); color: var(--on-deep); font-weight: 500; text-decoration: none; background: var(--deep-2); }

  body { padding-bottom: 72px; }
}
@media (max-width: 40rem) {

  .brand { font-size: var(--text-md); }

  .tbl--karty { overflow: visible; }

  .tbl--karty tbody th, .tbl--karty td { display: flex; gap: var(--space-md); padding: var(--space-2xs) 0; border: 0; }
  .tbl--karty td::before { content: attr(data-label); flex: 0 0 7rem; font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
  .tbl--karty td:empty { display: none; }
}
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: color-mix(in oklab, var(--color-ink) 8%, transparent); }
  .btn--primary:hover { background: var(--color-accent-2, var(--color-accent)); border-color: var(--color-accent-2, var(--color-accent)); }
  .btn--inv:hover { background: var(--on-deep-2); border-color: var(--on-deep-2); }
  .hero-txt .btn--primary:hover { background: color-mix(in oklab, var(--hero-btn) 86%, var(--hero-btn-ink)); border-color: transparent; }
  .btn--line-inv:hover, .hero-txt .btn:not(.btn--primary):hover { background: var(--deep-2); }
  .hero .link:hover { text-decoration-thickness: 2px; }
  .nav a:hover { color: var(--color-ink); background: var(--color-paper-2); }
  .seg label:hover { border-color: var(--color-muted); }
  .link:hover, .more:hover { text-decoration-thickness: 2px; }
  .plinks a:hover span, .foot a:hover { text-decoration: underline; text-decoration-color: var(--color-accent); }
  .rows dd a:hover { text-decoration-thickness: 2px; }
  .doc summary:hover::after { color: var(--color-ink); }
  .burger:hover { border-color: var(--color-muted); }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .seg label, .nav, .burger-i, .burger-i::before, .burger-i::after { transition: none; }
  .btn:active, .seg label:active { transform: none; }
}

<section class="phead"><div class="wrap"><p class="crumb"><a href="index.html">Autoškola Bartoníček</a><span aria-hidden="true">/</span><span>Školicí středisko</span></p>
<h1>Školicí středisko</h1><p class="lead">Školení řidičů referentů a&nbsp;profesní způsobilosti. Po domluvě přijedeme i&nbsp;k vám do firmy.</p></div></section>
<section class="sec"><div class="wrap"><div class="sec-head"><h2>Jaká školení děláme</h2></div><ol class="idx"><li><div><h3>Řidiči referenti</h3><p>Pro zaměstnance, kteří řídí služební nebo soukromé auto do 3 500 kg v&nbsp;práci. Počet hodin podle dohody, na přání i&nbsp;s přezkoušením.</p></div></li><li><div><h3>Vstupní školení profesní způsobilosti</h3><p>Pro řidiče skupin C, C+E, D a&nbsp;D+E: základní 140 hodin, rozšířené 280 hodin, rozšíření z&nbsp;C na D 45 hodin. Zkouška stojí 700 Kč, cena školení podle počtu uchazečů.</p></div></li><li><div><h3>Pravidelné roční školení</h3><p>7 hodin pro držitele osvědčení profesní způsobilosti, 900 Kč za řidiče včetně DPH.</p></div></li><li><div><h3>Řidiči vozíků</h3><p>Školení řidičů motorových manipulačních vozíků.</p></div></li><li><div><h3>Psychotesty</h3><p>Zajistíme psychotesty pro žadatele o&nbsp;vrácení řidičského oprávnění po 12 bodech.</p></div></li></ol></div></section><section class="sec sec--alt"><div class="wrap"><div class="sec-head"><h2>Jak se přihlásit na školení</h2></div><div class="lists n2"><div class="list"><h3>Pravidelné školení</h3><ul><li>Firma pošle jmenný seznam řidičů nejpozději 10 dní před termínem</li><li>Řidič sám pošle vyplněnou žádost nejpozději 10 dní před termínem</li></ul></div><div class="list"><h3>Vstupní školení</h3><ul><li>Vyplněný seznam žadatele pošlete nejpozději 14 dní před termínem</li><li>Po odevzdání na krajský úřad už nejde seznam měnit ani řidiče zaměnit</li></ul></div></div></div></section><section class="sec"><div class="wrap"><div class="sec-head"><h2>Tiskopis ke stažení</h2></div><ol class="idx"><li><div><h3>Žádost o&nbsp;přijetí do kurzu pravidelného školení</h3><p>Vyplňuje řidič. Dokument Word, 36 kB.</p></div><a class="more" href="https://autoskolabartonicek.cz/file/Zadost_skoleni_ridicu_2014.doc" target="_blank" rel="noopener">Stáhnout</a></li></ol></div></section><section class="cta"><div class="wrap cta-in"><div><h2>Termín a&nbsp;místo školení domluvíme</h2><p>Osobně, telefonem nebo e-mailem.</p></div><div class="cta-btns"><a class="btn btn--inv" href="tel:602888870"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span>602 888 870</span></a><a class="btn btn--line-inv" href="mailto:autoskolabartonicek@quick.cz"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>autoskolabartonicek@quick.cz</span></a></div></div></section>

<script>(()=>{
const root=document.getElementById('nahled-root'),toast=document.getElementById('nahled-toast');let t;
const say=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('on'),3200)};
const burger=()=>{const b=root.querySelector('.burger'),n=root.querySelector('#menu');if(!b||!n)return;
 const set=o=>{b.setAttribute('aria-expanded',o);document.body.classList.toggle('menu-open',o);b.querySelector('.burger-t').textContent=o?'Zavřít':'Menu'};
 b.addEventListener('click',()=>set(b.getAttribute('aria-expanded')!=='true'));set(false)};
const show=(slug,hash)=>{const tp=document.getElementById('p-'+slug);if(!tp)return;
 root.innerHTML='';root.appendChild(tp.content.cloneNode(true));
 document.body.className=tp.dataset.cls;document.title=tp.dataset.title;burger();
 const el=hash&&root.querySelector(hash);(el?el.scrollIntoView():window.scrollTo(0,0))};
const desc=h=>{const d=decodeURIComponent(h);
 if(d.startsWith('https://wa.me/'))return'WhatsApp: otevře chat s číslem +'+d.slice(14);
 if(d.startsWith('sms:'))return'SMS: otevře zprávu na číslo '+d.slice(4);
 if(d.startsWith('tel:'))return'Telefon: vytočí '+d.slice(4);
 if(d.startsWith('mailto:'))return'E-mail: otevře nový e-mail na '+d.slice(7);return null};
document.addEventListener('click',ev=>{const a=ev.target.closest('a');if(!a)return;const h=a.getAttribute('href')||'';
 const m=desc(h);if(m){ev.preventDefault();say(m+' (v náhledu vypnuto)');return}
 const p=h.match(/^([a-z0-9-]+)\.html(#.*)?$/i);if(p){ev.preventDefault();show(p[1],p[2]);document.body.classList.remove('menu-open');return}
 if(h.startsWith('#')){const el=root.querySelector(h);if(el){ev.preventDefault();el.scrollIntoView()}}
});
document.addEventListener('keydown',ev=>{const b=root.querySelector('.burger');if(ev.key==='Escape'&&b&&b.getAttribute('aria-expanded')==='true')b.click()});
show('index');
})();</script>
